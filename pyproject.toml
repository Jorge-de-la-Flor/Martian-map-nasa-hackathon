[project]
name = "martian-map-nasa-hackathon"
version = "0.1.0"
description = "Mars exploration and terrain-aware route planning."
readme = "README.md"
authors = [
    { name = "FrostCore", email = "159102314+Jorge-de-la-Flor@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

# [project.scripts]
# martian-map-nasa-hackathon = "martian_map_nasa_hackathon:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.uv]
package = false
